# ---------------------------------------------------------------------------
# check-upstream.yml
#
# Este repo NO construye la imagen en CI: son ~20 GB de trabajo y los runners
# de GitHub tienen ~14 GB de disco. La imagen se construye en tu máquina.
#
# Lo que sí automatiza CI es lo que se olvida en la práctica: enterarse de que
# salió una versión nueva. Corre una vez por mes y abre un issue si algo cambió
# respecto de versions.env.
# ---------------------------------------------------------------------------
name: Vigilar versiones upstream

on:
  schedule:
    - cron: "0 12 1 * *"   # día 1 de cada mes, 12:00 UTC
  workflow_dispatch:
  push:
    paths:
      - "**.sh"
      - "compose.yml"
      - ".env.example"
      - "sql/**"
      - ".github/workflows/check-upstream.yml"
  pull_request:
    paths:
      - "**.sh"
      - "compose.yml"
      - ".env.example"
      - "sql/**"

# Los permisos van por job, no acá: el lint solo lee el repo y no tiene por qué
# heredar el `issues: write` que necesita el otro job.
permissions:
  contents: read

jobs:
  # El build no corre en CI (~20 GB, los runners tienen ~14), pero el lint de
  # shell sí: es lo único automatizable de este repo y los `# shellcheck source=`
  # del código ya asumían un lint que nunca se configuró.
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: shellcheck
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # -x sigue los `source` para que resuelva base-profile.sh y lib/.
          shellcheck -x build.sh doctor.sh scripts/*.sh scripts/lib/*.sh

      - name: Sintaxis de los .sh restantes
        run: bash -n build.sh doctor.sh scripts/*.sh scripts/lib/*.sh

  # El build no corre en CI, pero los chequeos estaticos del doctor si, y eso
  # cubre reglas que hasta ahora no verificaba nadie: la de SQL 100 % ASCII la
  # documentaba CLAUDE.md con un `grep` que habia que acordarse de correr.
  #
  # El self-test va PRIMERO y a proposito: arma directorios rotos y comprueba
  # que cada chequeo los detecte. Sin el, `doctor.sh --static` saliendo 0 no
  # probaria nada —un chequeo con el grep mal escrito tambien sale 0—.
  #
  # Sobre un checkout limpio no hay .env, ni init/, ni cache/: los genera
  # ./build.sh. Esos chequeos reportan [SKIP] y el job pasa; lo que quede en
  # [FAIL] es un problema real del repo.
  doctor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Self-test de doctor.sh contra fixtures rotas
        run: ./scripts/test-doctor.sh

      - name: Chequeos estaticos sobre el checkout
        run: ./doctor.sh --static

  # El round-trip completo necesita el stack levantado (base + ORDS + ~16 GB de
  # imagen), asi que en CI corre lo que SI se puede: el self-test de los parsers
  # y la etapa `validate` contra el SQLcl de verdad.
  #
  # Los dos pasos cubren cosas distintas y por eso estan los dos. El self-test
  # prueba que los parsers detectan el fallo; `apex validate` real prueba que el
  # formato de salida que esos parsers esperan sigue siendo el que SQLcl emite.
  # Con solo el primero, una version nueva de SQLcl que cambie el texto romperia
  # el script y CI seguiria en verde.
  #
  # `apex validate` y `apex generate` no necesitan base: verificado contra
  # ords:26.1.2 con `sql /nolog`. La imagen se baja sin credenciales (~1,6 GB).
  roundtrip:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Self-test de los parsers con salidas reales de SQLcl
        run: ./scripts/test-roundtrip.sh

      - name: apex validate real contra la app de referencia
        shell: bash
        run: |
          set -Eeuo pipefail
          source versions.env
          IMG="container-registry.oracle.com/database/ords:${ORDS_TAG}"
          docker pull -q "${IMG}"

          # Se genera la app con el generador oficial de Oracle y se la valida,
          # las dos cosas sin base (`sql /nolog`).
          docker run --rm --entrypoint bash "${IMG}" -c '
            printf "apex generate -dir /tmp/g -alias APEXLAB-ROUNDTRIP -id 9000 -name \"apex-lab roundtrip\"\nexit\n" \
              | sql -s /nolog
            printf "apex validate -input /tmp/g/apexlab-roundtrip\nexit\n" | sql -s /nolog' \
            | tee validate.log

          # El veredicto lo da el MISMO parser que usa el script, no un grep
          # escrito aparte: si el formato de salida de SQLcl cambia, lo que
          # tiene que fallar es el codigo que corre de verdad.
          source scripts/lib/checks.sh
          source scripts/lib/roundtrip.sh
          grep -qF 'Files created at' validate.log \
            || { echo "::error::apex generate no genero la app de referencia"; exit 1; }
          rt_parse_validate validate.log \
            || { echo "::error::${CHECK_DETAIL%%$'\n'*}"; exit 1; }
          echo "OK: ${CHECK_DETAIL}"

  check:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write     # abre, comenta o cierra el issue de actualizaciones
    env:
      # El prefijo del título es lo que enlaza las tres operaciones sobre el
      # issue: crearlo, comentarlo y cerrarlo. Va definido una sola vez. Escrito
      # suelto en cada paso, el día que alguien lo cambie en uno el workflow
      # deja de encontrar su propio issue y abre uno nuevo cada mes, en silencio.
      ISSUE_PREFIX: "Actualizaciones upstream disponibles"
    steps:
      - uses: actions/checkout@v5

      - name: Comparar versiones fijadas contra upstream
        id: check
        shell: bash
        run: |
          set -Eeuo pipefail
          source versions.env

          findings=""

          # --- Imagen base de la BD ---------------------------------------
          # Tags con formato 23.YY.N (el esquema de 3 dígitos vigente).
          latest_db=$(curl -fsSL \
            "https://hub.docker.com/v2/repositories/gvenzl/oracle-free/tags?page_size=100" \
            | grep -oE '"name":"23\.[0-9]+\.[0-9]+-full-faststart"' \
            | sed 's/.*:"//;s/"//' | sort -V | tail -1 || true)
          current_db="${DB_BASE_IMAGE#*:}"
          if [[ -n "${latest_db}" && "${latest_db}" != "${current_db}" ]]; then
            findings+="- Imagen base: fijada \`${current_db}\`, disponible \`${latest_db}\`"$'\n'
          fi

          # --- APEX --------------------------------------------------------
          # No hay API de versión, así que se compara el zip fijado contra
          # apex-latest.zip: mientras no haya release nuevo, son dos rutas al
          # MISMO archivo.
          #
          # La huella es el ETag del CDN, pero solo su primera mitad. Oracle
          # sirve `<hash-del-contenido>:<timestamp-de-publicación>` y publica
          # cada ruta por separado (en 26.1: 11:25 y 13:05 del mismo día), así
          # que el timestamp NUNCA coincide aunque el zip sea idéntico. Por eso
          # el check original, que comparaba Last-Modified, anunciaba un
          # release nuevo en cada corrida.
          #
          # Si el CDN dejara de mandar ETag se cae a Content-Length, que
          # detecta el release nuevo igual pero se le escaparía un re-release
          # del mismo peso.
          hdr_last() {
            # Con -L hay varios bloques de cabeceras: vale la última aparición.
            # El `|| true` es para que un grep sin match no aborte por pipefail.
            grep -i "^$2:" <<<"$1" | tr -d '\r"' | awk '{print $2}' | tail -1 || true
          }
          fetch_headers() {
            # `-f` NO evita que `-I` haya volcado ya las cabeceras del error, y
            # la página de error de Akamai trae su propio ETag. Sin descartar la
            # salida cuando curl falla, un 404 en la URL fijada se leía como
            # "hay release nuevo" en vez de "el zip ya no está".
            local out
            out=$(curl -fsSLI --max-time 60 "$1") || return 1
            printf '%s\n' "${out}"
          }
          h_latest=$(fetch_headers \
            "https://download.oracle.com/otn_software/apex/apex-latest.zip" || true)
          h_pinned=$(fetch_headers "${APEX_URL}" || true)

          etag_latest=$(hdr_last "${h_latest}" etag); etag_latest="${etag_latest%%:*}"
          etag_pinned=$(hdr_last "${h_pinned}" etag); etag_pinned="${etag_pinned%%:*}"
          size_latest=$(hdr_last "${h_latest}" content-length)
          size_pinned=$(hdr_last "${h_pinned}" content-length)

          if [[ -z "${h_pinned}" ]]; then
            findings+="- APEX: no se pudo leer \`${APEX_URL}\`. Puede que Oracle haya retirado el zip de ${APEX_VERSION}."$'\n'
          elif [[ -z "${h_latest}" ]]; then
            # Sin este aviso el check quedaría ciego en silencio, que es peor
            # que no tenerlo: nadie se enteraría de que dejó de vigilar.
            findings+="- APEX: no se pudo leer \`apex-latest.zip\`. El check quedo sin referencia; si Oracle movio esa URL, hay que corregirla en este workflow."$'\n'
          elif [[ -n "${etag_latest}" && -n "${etag_pinned}" ]]; then
            if [[ "${etag_latest}" != "${etag_pinned}" ]]; then
              findings+="- APEX: el contenido de \`apex-latest.zip\` (ETag \`${etag_latest}\`) no coincide con el zip fijado de ${APEX_VERSION} (ETag \`${etag_pinned}\`). Hay release nuevo o re-release (ojo: el SHA256 cambia)."$'\n'
            fi
          elif [[ -n "${size_latest}" && -n "${size_pinned}" && "${size_latest}" != "${size_pinned}" ]]; then
            findings+="- APEX: sin ETag en la respuesta; \`apex-latest.zip\` pesa ${size_latest} bytes y el zip fijado de ${APEX_VERSION} pesa ${size_pinned}. Hay release nuevo o re-release (ojo: el SHA256 cambia)."$'\n'
          fi

          if [[ -z "${findings}" ]]; then
            echo "Todo al día."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            { echo 'body<<EOF'; echo "${findings}"; echo 'EOF'; } >> "$GITHUB_OUTPUT"
          fi

      # El workflow corre todos los meses y los hallazgos suelen seguir
      # pendientes. Sin buscar primero, cada corrida abría otro issue por lo
      # mismo, y como el título lleva el mes ni siquiera colisionaban.
      - name: Abrir o actualizar el issue
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: ${{ steps.check.outputs.body }}
        run: |
          set -Eeuo pipefail

          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title | startswith($ENV.ISSUE_PREFIX))][0].number // empty')

          if [[ -z "${existing}" ]]; then
            gh issue create \
              --title "${ISSUE_PREFIX} ($(date +%Y-%m))" \
              --body "$(printf 'Detectado por el workflow mensual:\n\n%s\n\nPasos: actualizar `versions.env`, vaciar `APEX_SHA256`, correr `./build.sh` y fijar el hash nuevo.\n\nAntes de subir de versión de APEX, revisar los requisitos de ORDS y de BD en las release notes.' "$BODY")"
            exit 0
          fi

          # Ya hay uno abierto. Si dice exactamente esto, no tiene sentido
          # comentar todos los meses: solo avisamos cuando el hallazgo cambia.
          last=$(gh issue view "${existing}" --json body,comments \
            --jq '(.comments | last | .body) // .body' | tr -d '\r')
          if [[ "${last}" == *"${BODY}"* ]]; then
            echo "El issue #${existing} ya reporta esto mismo; no comento."
            exit 0
          fi

          gh issue comment "${existing}" \
            --body "$(printf 'Corrida del %s, cambió lo detectado:\n\n%s' "$(date -u +%F)" "$BODY")"

      # Contrapeso del paso anterior: sin esto un issue sobrevive a su propia
      # causa. Ese paso solo corre cuando HAY hallazgos, así que nadie avisaba
      # cuando dejaba de haberlos y el issue quedaba abierto para siempre, aunque
      # versions.env ya estuviera al día. Pasó con el #1: se abrió por la base
      # 23.26.2 y por un falso positivo de APEX del check viejo, los dos
      # quedaron resueltos a los dos días y el issue siguió abierto igual.
      #
      # Cerrarlo es además la única señal de "al día" que emite este workflow:
      # sin hallazgos y sin issue abierto, una corrida exitosa no deja rastro
      # visible fuera del log de Actions.
      - name: Cerrar el issue si ya no hay hallazgos
        if: steps.check.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title | startswith($ENV.ISSUE_PREFIX))][0].number // empty')

          [[ -n "${existing}" ]] || { echo "Todo al día y no hay issue abierto."; exit 0; }

          gh issue close "${existing}" --reason completed --comment \
            "Corrida del $(date -u +%F): las versiones fijadas en \`versions.env\` vuelven a coincidir con upstream. Se cierra automáticamente."
