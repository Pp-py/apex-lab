# ---------------------------------------------------------------------------
# compose.yml — Stack de desarrollo APEX.
#
# El nombre del proyecto define los volúmenes, así que cada proyecto nuevo es
# un entorno aislado sobre la MISMA imagen:
#
#     COMPOSE_PROJECT_NAME=proyecto-x docker compose up -d
#     COMPOSE_PROJECT_NAME=proyecto-x docker compose down -v   # borra todo
#
# El .env lo genera ./build.sh la primera vez (y valida en cada corrida que el
# bloque derivado siga coincidiendo con versions.env).
# ---------------------------------------------------------------------------
name: ${COMPOSE_PROJECT_NAME:-apexlab}

services:

  # -------------------------------------------------------------------------
  # Base de datos con APEX ya instalado (imagen generada por ./build.sh)
  # -------------------------------------------------------------------------
  db:
    image: ${APEX_DB_IMAGE:-apex-lab:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-apexlab}-db
    restart: unless-stopped
    shm_size: 2gb
    environment:
      # Semillas que leen los .sh de ./init. Se declaran SIN valor por defecto a
      # propósito: el default vive en .env.example y solo ahí, así que si falta
      # en tu .env el script de init falla con un mensaje claro en vez de crear
      # el esquema con una contraseña que no es la que creías.
      APP_WORKSPACE: ${APP_WORKSPACE}
      APP_SCHEMA: ${APP_SCHEMA}
      APP_WS_USER: ${APP_WS_USER}
      APP_EMAIL: ${APP_EMAIL}
      APP_PASSWORD: ${APP_PASSWORD}
      PDBADMIN_PASSWORD: ${PDBADMIN_PASSWORD}
    ports:
      # BIND_ADDR es 127.0.0.1 por defecto a propósito: las credenciales de este
      # entorno son públicas (viven en versions.env) y APEX corre sin HTTPS.
      # Publicar en 0.0.0.0 deja la base y el Builder al alcance de cualquiera
      # en tu red. Ver la nota en .env.example antes de cambiarlo.
      - "${BIND_ADDR:-127.0.0.1}:${DB_PORT:-1521}:1521"
    volumes:
      # Primer `up`: Docker copia los datafiles (~4,5 GB) de la imagen al
      # volumen. Solo pasa una vez por proyecto. A cambio, los cambios de
      # esquema (y la instalación de ORDS) sobreviven a `down` sin `-v`.
      - oradata:/opt/oracle/oradata
      # Semillas del proyecto: se ejecutan como SYS contra la CDB en CADA
      # arranque, así que tienen que ser idempotentes. Ver init.example/README.md.
      #
      # No es initdb.d: el entrypoint corre ese directorio solo cuando la base no
      # existe, y nuestra imagen ya la trae creada (-faststart + commit), así que
      # lo saltea siempre. La ruta depende de la imagen base (DB_IMAGE_PROFILE).
      - ./init:${DB_SEED_DIR:-/container-entrypoint-startdb.d}:ro
    healthcheck:
      test: ["CMD", "${DB_HEALTHCHECK_CMD:-healthcheck.sh}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # -------------------------------------------------------------------------
  # ORDS oficial de Oracle. No se hornea: se actualiza cambiando el tag.
  # -------------------------------------------------------------------------
  ords:
    image: container-registry.oracle.com/database/ords:${ORDS_TAG:-26.1.2}
    container_name: ${COMPOSE_PROJECT_NAME:-apexlab}-ords
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DBHOST: db
      DBPORT: 1521
      DBSERVICENAME: FREEPDB1
      ORACLE_PWD: ${ORACLE_PASSWORD:-oracle}
      ORDS_PWD: ${ORACLE_PASSWORD:-oracle}
      # SQLcl vive en ESTE contenedor, no en el de la base, y es lo que corre
      # `apex export`. Sin estas dos, el comando documentado en
      # apps.example/README.md conecta sin usuario y da ORA-01017.
      APP_SCHEMA: ${APP_SCHEMA}
      APP_PASSWORD: ${APP_PASSWORD}
    volumes:
      # Estáticos de APEX (/i/). Salen del instalador que ya descargó build.sh.
      - ./cache/apex:/opt/oracle/apex:ro
      # Config de ORDS persistente: sin esto reinstala en cada arranque.
      - ords_config:/etc/ords/config
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${ORDS_PORT:-8080}:8080"

  # -------------------------------------------------------------------------
  # Mailpit: captura TODO el correo saliente. Nada sale a internet.
  # -------------------------------------------------------------------------
  mail:
    image: axllent/mailpit:latest
    container_name: ${COMPOSE_PROJECT_NAME:-apexlab}-mail
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MAILPIT_PORT:-8025}:8025"   # UI web
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  oradata:
  ords_config:
